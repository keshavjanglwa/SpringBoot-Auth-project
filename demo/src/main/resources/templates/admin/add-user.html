<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add User</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width:500px;">
    <h1>Add New User</h1>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/admin/users/add}" method="post">
        <div class="form-group">
            <label for="username">Email</label>
            <input type="email" id="username" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        <button type="submit" class="btn btn-blue">Save User</button>
        <a th:href="@{/admin/users}" class="btn btn-gray">Cancel</a>
    </form>
</div>
</body>
</html>
