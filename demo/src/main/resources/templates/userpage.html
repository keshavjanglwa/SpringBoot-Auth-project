<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>User Page</title>
  <link th:href="@{/css/styles.css}" href="styles.css" rel="stylesheet">
</head>

<body>
  <div class="stage">

    <div class="badge user">
      <div class="stripe"></div>
      <div class="role">Member<br>Access</div>
      <div class="id">ROLE · USER</div>
      <div class="barcode"></div>
    </div>

    <div class="eyebrow user"><span class="dot"></span> USER WORKSPACE</div>

    <div class="card">
      <div class="icon-ring">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2F6FE4" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="14" rx="2"></rect>
          <path d="M3 9h18"></path>
          <circle cx="7" cy="6.5" r="0.6" fill="#2F6FE4" stroke="none"></circle>
        </svg>
      </div>

      <h1>User Page</h1>
      <p class="sub">Welcome, <span th:text="${username}">member</span>! This page is only for signed-in users.</p>

      <div class="actions">
        <a class="btn" href="/home/home-page">Home <span class="arrow">→</span></a>
        <a class="btn logout" href="/logout">Logout</a>
      </div>
    </div>

  </div>
</body>

</html>
