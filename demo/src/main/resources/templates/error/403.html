<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 100px;
            color: #dc3545;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5563d6;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🔒</div>
    <h1>403</h1>
    <h2>Access Denied</h2>
    <p>
        Sorry, you don't have permission to access this page.
        Please contact the administrator if you believe this is an error.
    </p>

    <a href="/home/home-page" class="btn">Go to Home</a>
</div>

</body>
</html>
